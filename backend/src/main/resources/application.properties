# ==========================================
# Database PostgreSQL Configuration
# ==========================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=tenderflow_user
quarkus.datasource.password=tenderflow_password

# URL JDBC per Dev Mode (Host) e Produzione (Container)
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/tenderflow
quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/tenderflow

# Persistenza Database
quarkus.hibernate-orm.schema-management.strategy=update

# ==========================================
# Kafka Configuration (SmallRye Messaging)
# ==========================================
quarkus.kafka.devservices.enabled=false

# Bootstrap Servers: porta 29092 (EXTERNAL) per Dev Mode, kafka:9092 (INTERNAL) per Docker
%dev.kafka.bootstrap.servers=localhost:29092
%dev.mp.messaging.connector.smallrye-kafka.bootstrap.servers=localhost:29092

kafka.bootstrap.servers=kafka:9092
mp.messaging.connector.smallrye-kafka.bootstrap.servers=kafka:9092

# Channels: Tender Events
mp.messaging.outgoing.tender-events-out.connector=smallrye-kafka
mp.messaging.outgoing.tender-events-out.topic=tender-events

mp.messaging.incoming.tender-events-in.connector=smallrye-kafka
mp.messaging.incoming.tender-events-in.topic=tender-events
mp.messaging.incoming.tender-events-in.group.id=tenderflow-consumer-group
mp.messaging.incoming.tender-events-in.auto.offset.reset=earliest

# Channels: Bid Events
mp.messaging.outgoing.bid-events-out.connector=smallrye-kafka
mp.messaging.outgoing.bid-events-out.topic=bid-events

mp.messaging.incoming.bid-events-in.connector=smallrye-kafka
mp.messaging.incoming.bid-events-in.topic=bid-events
mp.messaging.incoming.bid-events-in.group.id=tenderflow-bid-consumer-group
mp.messaging.incoming.bid-events-in.auto.offset.reset=earliest

# ==========================================
# OpenAPI & Swagger UI Configuration
# ==========================================
quarkus.smallrye-openapi.info-title=TenderFlow REST API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API per la gestione delle gare d'appalto e sottomissione offerte event-driven
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ==========================================
# Security & JWT Configuration
# ==========================================
mp.jwt.verify.issuer=https://tenderflow.it/issuer
smallrye.jwt.enabled=true
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=jwtAuth
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem

# Abilita CORS per Angular
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-allow-credentials=true

quarkus.http.port=8081