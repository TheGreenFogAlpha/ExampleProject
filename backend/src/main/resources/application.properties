# Configurazione Database PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=tenderflow_user
quarkus.datasource.password=tenderflow_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/tenderflow

# Generazione automatica delle tabelle (sintassi moderna)
quarkus.hibernate-orm.schema-generation.database.action=update

# Disattiva i Dev Services per usare il tuo container Docker manuale
quarkus.kafka.devservices.enabled=false

# Indirizzo esatto del broker Kafka avviato con Docker Compose
kafka.bootstrap.servers=localhost:9092
mp.messaging.connector.smallrye-kafka.bootstrap.servers=localhost:9092

# Configurazione Kafka Producer
mp.messaging.outgoing.tender-events-out.connector=smallrye-kafka
mp.messaging.outgoing.tender-events-out.topic=tender-events
mp.messaging.outgoing.tender-events-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Configurazione Kafka Consumer
mp.messaging.incoming.tender-events-in.connector=smallrye-kafka
mp.messaging.incoming.tender-events-in.topic=tender-events
mp.messaging.incoming.tender-events-in.value.deserializer=io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
mp.messaging.incoming.tender-events-in.group.id=tenderflow-consumer-group
mp.messaging.incoming.tender-events-in.auto.offset.reset=earliest