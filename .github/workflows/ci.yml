name: TenderFlow CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test Quarkus Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Start Infrastructure Services (PostgreSQL & Kafka)
        run: docker compose up -d --wait postgres kafka

      - name: Build and run tests
        working-directory: ./backend
        run: |
          mvn clean verify \
            -Dquarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/tenderflow \
            -Dquarkus.datasource.username=tenderflow_user \
            -Dquarkus.datasource.password=tenderflow_password \
            -Dkafka.bootstrap.servers=localhost:29092

      - name: Build Docker Image (Dry-Run)
        run: docker compose build backend